name: Verify Living Grimoire

on:
  push:
    branches:
      - agent/living-black-mirror-pass
      - agent/living-grimoire-v-candidate
      - agent/release-candidate-polish
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate, production build, and dependency security
        run: npm run release:check
