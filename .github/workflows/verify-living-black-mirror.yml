name: Verify Living Black Mirror

on:
  push:
    branches: [agent/living-black-mirror-pass]
  pull_request:
    branches: [claude/ecstatic-euler-dwgsf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify mirror geometry and build
        run: npm run check
